<!DOCTYPE html>
<html>
<head>
    <title>Popup Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .btn {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .popup {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }

        .popup-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        .close {
            float: right;
            font-size: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Popup Login Form</h2>

    <button class="btn" onclick="openPopup()">Login</button>

    <div id="loginPopup" class="popup">
        <div class="popup-content">
            <span class="close" onclick="closePopup()">&times;</span>
            <h2>Login</h2>

            <input type="text" placeholder="Username" required><br>
            <input type="password" placeholder="Password" required><br>

            <button class="btn">Submit</button>
        </div>
    </div>

    <script>
        function openPopup() {
            document.getElementById("loginPopup").style.display = "block";
        }

        function closePopup() {
            document.getElementById("loginPopup").style.display = "none";
        }
    </script>

</body>
</html>
