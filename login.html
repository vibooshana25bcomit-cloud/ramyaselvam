<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 80px;
        }

        .logo{
            width: 120px;
            height: 120px;
            background-color: #0066cc;
            color: white;
            border-radius: 50%;
            margin: auto;
            line-height: 120px;
            font-size: 40px;
            font-weight: bold;
        }

        .login-box{
            background: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        input{
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button{
            width: 95%;
            padding: 10px;
            background: #0066cc;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="logo">L</div>

    <div class="login-box">
        <h2>Login</h2>
        <input type="text" placeholder="Username"><br>
        <input type="password" placeholder="Password"><br>
        <button>Login</button>
    </div>

</body>
</html>
